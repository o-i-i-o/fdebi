[package]
name = "fdebi-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local .deb parsing, libapt-pkg-based dependency solving and install orchestration core (successor of gdebi's pipeline)"

# 开发/测试 CLI:命令行直跑 deb 安装管线,不参与 deb 打包;
# 独立 bin target,代码只在 src/main.rs,不进入库(不会链接进 daemon/gtk)
[[bin]]
name = "fdebi-core"
path = "src/main.rs"

[dependencies]
ar.workspace = true
tar.workspace = true
flate2.workspace = true
gettext-rs.workspace = true
libc.workspace = true
md-5.workspace = true
lzma-rs.workspace = true
ruzstd.workspace = true
# 仅 bin target(main.rs)引用;库不使用,不影响 daemon/gtk 链接产物
clap.workspace = true

[build-dependencies]
# build.rs:Linux 编译 native/apt_shim.cc,非 Linux 编译 apt_stub.c
cc = "1"
