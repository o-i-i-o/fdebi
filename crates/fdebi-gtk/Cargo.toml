[package]
name = "fdebi-gtk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "fdebi GTK4 frontend"

[[bin]]
name = "fdebi-gtk"
path = "src/main.rs"

[dependencies]
fdebi-core.workspace = true
clap.workspace = true
gtk4 = { version = "0.9", features = ["v4_6"] }

async-channel = "2"

# 守护进程客户端(系统总线 org.fdebi;纯 Rust D-Bus 实现)
zbus.workspace = true

# 信号流迭代(StreamExt::next;zbus 只重导出 futures_core)
futures-lite.workspace = true
