[workspace]
resolver = "2"
members = ["crates/fdebi-core", "crates/fdebi-gtk", "crates/fdebi-daemon"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
fdebi-core = { path = "crates/fdebi-core" }
# gettext-system:链接系统 libintl(glibc),走标准 bindtextdomain 流程
gettext-rs = { version = "0.7", features = ["gettext-system"] }
ar = "0.9"
tar = "0.4"
flate2 = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

# --- libapt-pkg FFI(求解/索引/下载),Rust 侧仅保留 conffile 预检的 md5 ---
# conffile 预检(apt 记录的装包时 md5 比对)
md-5 = "0.10"

# deb 归档解压(control/data 成员的 xz 与 zstd 压缩,均纯 Rust 后端)
lzma-rs = "0.3"
ruzstd = "0.7"

# D-Bus(纯 Rust 实现,不依赖 libdbus)
zbus = "5"

# 信号体序列化 trait(zbus/zvariant 生态标准)
serde = "1"
async-channel = "2"

# zbus 默认 async-io 运行时;守护进程工作线程用它 block_on 发信号
async-io = "2"

# 客户端信号流迭代(轻量 Stream 工具,无 proc 宏)
futures-lite = "2"
